# configs/template_tfr.yaml
# EEG Toolkit — Time-Frequency Analysis Template
#
# USE THIS WHEN:
#   - You want to analyze oscillatory power (alpha, beta, gamma, theta, etc.)
#   - You want to run cluster-based permutation tests on TFR data
#   - You want induced power (non-phase-locked) or total power
#
# HOW TO USE:
#   1. Copy this file: cp template_tfr.yaml my_tfr_analysis.yaml
#   2. Fill in your window names, frequency range, and conditions
#   3. In your notebook: load_config('configs/my_tfr_analysis.yaml')
#
# See configs/README.md for the full decision guide.
# ============================================================================

tfr:
  # Per-window analysis parameters.
  # Window names must match `name` fields in your main pipeline config's
  # epoching_windows section. Use long windows (>= 1 s) for good
  # frequency resolution at low frequencies.
  windows:
    - name: stimulus             # replace with your window name
      baseline: [-0.2, 0.0]     # pre-stimulus baseline interval (seconds)

    # Add more windows if needed:
    # - name: response
    #   baseline: [-0.5, -0.3]

  # Channel selection (passed to epochs.pick()).
  picks: eeg

  # Morlet wavelet parameters
  method: morlet
  freqs:
    start: 4                     # lowest frequency (Hz); go down to 2 for delta/theta
    stop: 40                     # highest frequency (Hz)
    step: 1                      # frequency resolution (Hz)

  # Number of cycles per wavelet.
  # 'adaptive': n_cycles = freqs / 2 (recommended — balances time and frequency resolution)
  # Or set a fixed integer, e.g.: n_cycles: 7 (better frequency resolution, worse temporal)
  n_cycles_mode: adaptive
  n_cycles_min: 3                # minimum cycles floor for low frequencies

  # Power decomposition mode:
  #   'induced'  — subtract the ERP before TFR (removes phase-locked activity)
  #                Use for oscillatory/non-phase-locked activity (alpha, beta, gamma)
  #   'total'    — compute TFR on raw single trials (includes phase-locked activity)
  #                Use when you want everything, or for theta/gamma phase-locking
  #   'evoked'   — compute TFR on the averaged ERP (only phase-locked activity)
  decomposition: induced

  # Baseline correction mode:
  #   'logratio'  — log10(power / mean_baseline)  [recommended, decibel-like scale]
  #   'ratio'     — power / mean_baseline
  #   'zscore'    — (power - mean_baseline) / std_baseline
  #   'percent'   — (power - mean_baseline) / mean_baseline * 100
  baseline_mode: logratio

  # Downsample the TFR output time axis by this factor.
  # Reduces memory and file size. 1 = no downsampling. 2 = halve time resolution.
  decim: 2

  # Number of parallel jobs. -1 = use all available CPU cores.
  n_jobs: -1

  # Skip subjects with fewer than this many trials in any condition.
  min_trials_per_condition: 10

# ============================================================================
# Conditions — defined per window.
# Format: condition_name: [list of event codes]
# ============================================================================
conditions:
  stimulus:                      # must match the window name above
    condition_a: [10, 11]        # replace with your condition name and codes
    condition_b: [20, 21]

# ============================================================================
# Contrasts
# Format: contrast_name: {condition_name: weight, ...}
# ============================================================================
contrasts:
  stimulus:
    a_vs_b: {condition_a: 1, condition_b: -1}
