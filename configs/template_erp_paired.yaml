# configs/template_erp_paired.yaml
# EEG Toolkit — ERP Analysis Template (Paired / 2-condition branch)
#
# USE THIS WHEN:
#   - You want to compare two (or more) conditions directly
#   - Each condition is defined by one or more event codes collapsed together
#   - You want a simple A vs B contrast (e.g., condition A vs condition B)
#
# WHEN NOT TO USE:
#   - You have multiple factors to cross (e.g., 2×2 design) → use template_erp_factorial.yaml
#
# HOW TO USE:
#   1. Copy this file: cp template_erp_paired.yaml my_erp_analysis.yaml
#   2. Fill in your condition names and event codes
#   3. In your notebook: load_config('configs/my_erp_analysis.yaml')
#
# See configs/README.md for the full decision guide.
# ============================================================================

erp:
  # Optional suffix added to all output filenames for this analysis.
  # Useful if running multiple ERP analyses on the same dataset.
  # Leave commented out if you only have one ERP analysis.
  # analysis_name: paired

  # Per-window analysis parameters.
  # Window names must match `name` fields in your main pipeline config's
  # epoching_windows section.
  windows:
    - name: stimulus             # replace with your window name
      baseline: [-0.2, 0.0]     # baseline interval in seconds; null = no baseline
      lowpass: 30                # analysis-time lowpass filter (Hz); null = skip

    # Add more windows if needed:
    # - name: response
    #   baseline: [-0.1, 0.0]
    #   lowpass: 30

  # Channel selection (passed to epochs.pick()).
  picks: eeg

  # Equalize trial counts across conditions before averaging?
  # Recommended when comparing conditions to avoid bias.
  equalize_counts: true

  # Skip subjects with fewer than this many trials in any condition.
  min_trials_per_condition: 10

# ============================================================================
# Conditions — defined per window.
# Format: condition_name: [list of event codes]
# All codes in a list are averaged into a single condition evoked.
# ============================================================================
conditions:
  stimulus:                      # must match the window name above
    condition_a: [10, 11]        # replace with your condition name and codes
    condition_b: [20, 21]        # replace with your condition name and codes

# ============================================================================
# Contrasts — weighted linear combinations of conditions.
# Format: contrast_name: {condition_name: weight, ...}
# Standard A - B contrast: condition_a = +1, condition_b = -1
# Remove or leave empty if no contrasts are needed.
# ============================================================================
contrasts:
  stimulus:
    a_vs_b: {condition_a: 1, condition_b: -1}
